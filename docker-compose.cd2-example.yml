# CloudDrive2 集成配置示例

本文件展示了如何正确配置 CloudDrive2 和 iso-packer 容器的挂载传播。

## 完整的 docker-compose.yml 示例

```yaml
services:
  # CloudDrive2 容器（推荐配置）
  cloudnas:
    container_name: clouddrive2
    image: cloudnas/clouddrive2-unstable:latest

    network_mode: host
    pid: host
    privileged: true
    restart: always

    devices:
      - /dev/fuse:/dev/fuse

    environment:
      - CLOUDDRIVE_HOME=/Config
      - ENABLE_RUN_AFTER_START=true

    volumes:
      # 关键：使用 shared 传播创建挂载源
      - /CloudNAS:/CloudNAS:shared
      - /root/clouddrive2:/Config
      # 可选：访问宿主机所有路径
      - /:/host:rshared

  # iso-packer 容器
  iso-packer:
    container_name: iso-packer
    image: ebichu/iso-packer:latest

    network_mode: bridge
    restart: unless-stopped

    ports:
      - "15865:15865"

    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1

    volumes:
      - ./data:/data
      - /mnt/115Download:/watch
      - /mnt/iso-output:/output

      # 关键：使用 rslave 接收来自 CD2 的挂载传播
      - /CloudNAS:/CloudNAS:rslave

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
```

## 挂载传播说明

### CloudDrive2 配置
```yaml
- /CloudNAS:/CloudNAS:shared
```
- `shared` 表示此容器创建的子挂载会传播给其他容器
- CD2 在容器内创建 `/CloudNAS/CloudDrive` FUSE 挂载

### iso-packer 配置
```yaml
- /CloudNAS:/CloudNAS:rslave
```
- `rslave` 表示此容器接收来自上游的挂载传播
- iso-packer 能看到 CD2 创建的 `/CloudNAS/CloudDrive` 挂载

## 配置文件调整

iso-packer 的 `config.json` 需要修改路径：

```json
{
  "cd2_mount_root": "/CloudNAS",
  "cd2_target_dir": "/CloudNAS/CloudDrive"
}
```

## 验证方法

```bash
# 1. 检查 CD2 挂载
docker exec -it clouddrive2 ls -la /CloudNAS/CloudDrive/

# 2. 检查 iso-packer 能否看到
docker exec -it iso-packer ls -la /CloudNAS/CloudDrive/

# 两个命令应该看到相同的文件列表
```

