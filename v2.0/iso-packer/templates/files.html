{% extends "base.html" %}

{% block content %}
<div class="border-b border-zinc-200 pb-4">
    <h2 class="text-sm font-bold tracking-widest text-zinc-400 uppercase">文件浏览</h2>
    <p class="text-xs text-zinc-500 mt-0.5">浏览本机监控、本机输出和网盘挂载目录；网盘挂载目录可提交 CD2 网盘内复制到监控目录，也可复制到其他本地目录</p>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
    <div class="bg-white border border-zinc-200/80 shadow-[0_4px_12px_rgba(0,0,0,0.01)] rounded-xl p-3 ring-1 ring-black/[0.01]">
        <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider font-mono">当前根目录</div>
        <div id="file-current-root" class="text-xs font-bold text-zinc-800 mt-0.5 font-mono">--</div>
    </div>
    <div class="bg-white border border-zinc-200/80 shadow-[0_4px_12px_rgba(0,0,0,0.01)] rounded-xl p-3 ring-1 ring-black/[0.01]">
        <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider font-mono">原盘线索</div>
        <div id="file-disc-count" class="text-xs font-bold text-amber-600 mt-0.5 font-mono">0</div>
    </div>
    <div class="bg-white border border-zinc-200/80 shadow-[0_4px_12px_rgba(0,0,0,0.01)] rounded-xl p-3 ring-1 ring-black/[0.01]">
        <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider font-mono">目录数量</div>
        <div id="file-dir-count" class="text-xs font-bold text-zinc-700 mt-0.5 font-mono">0</div>
    </div>
    <div class="bg-white border border-zinc-200/80 shadow-[0_4px_12px_rgba(0,0,0,0.01)] rounded-xl p-3 ring-1 ring-black/[0.01]">
        <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider font-mono">筛选 / 已选</div>
        <div id="file-entry-count" class="text-xs font-bold text-zinc-700 mt-0.5 font-mono">0</div>
        <div id="file-selected-count" class="mt-1 text-[10px] font-bold text-emerald-700">0 项已选</div>
    </div>
</div>

<div class="bg-white border border-zinc-200 rounded-xl p-3 space-y-3 text-xs shadow-sm">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex items-center gap-3 flex-1 max-w-md">
            <input type="text" id="file-search" aria-label="搜索当前目录下的文件" placeholder="搜索当前目录下的文件..."
                   class="w-full bg-[#fbfbfa] border border-zinc-200 rounded-lg px-3 py-1.5 font-mono text-zinc-800 focus:outline-none focus:border-zinc-400 shadow-inner">
        </div>

        <div class="flex items-center gap-2 flex-wrap text-[11px]">
            <div class="flex items-center gap-1 rounded-xl border border-zinc-200 bg-zinc-50 p-1">
                <span class="px-2 text-[10px] font-black tracking-[0.12em] text-zinc-400">位置</span>
                <div class="flex gap-1 root-switcher">
                    <button type="button" data-root="watch" data-root-path="{{ browser_roots.watch|e }}" data-active="true" class="rounded-lg px-3 py-1.5 font-bold transition">本机监控</button>
                    <button type="button" data-root="output" data-root-path="{{ browser_roots.output|e }}" data-active="false" class="rounded-lg px-3 py-1.5 font-bold transition">本机输出</button>
                    <button type="button" data-root="cd2" data-root-path="{{ browser_roots.cd2|e }}" data-active="false" class="rounded-lg px-3 py-1.5 font-bold transition">网盘挂载</button>
                </div>
            </div>
            <button type="button" id="file-up" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 font-bold text-zinc-600 hover:border-zinc-300 hover:text-zinc-900 transition" title="返回上级">上级</button>
            <button type="button" id="file-refresh" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 font-bold text-zinc-600 hover:border-zinc-300 hover:text-zinc-900 transition" title="刷新当前目录">刷新</button>
        </div>
    </div>
    <div class="flex flex-col gap-3 border-t border-zinc-100 pt-3 md:flex-row md:items-center md:justify-between">
        <div id="file-filters" class="flex w-fit p-0.5 bg-zinc-100 rounded-lg border border-zinc-200/60 font-medium">
            <button type="button" data-file-filter="all" data-active="true" class="px-2.5 py-1 rounded-md text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">全部</button>
            <button type="button" data-file-filter="disc" data-active="false" class="px-2.5 py-1 rounded-md text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">原盘</button>
            <button type="button" data-file-filter="dir" data-active="false" class="px-2.5 py-1 rounded-md text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">目录</button>
            <button type="button" data-file-filter="file" data-active="false" class="px-2.5 py-1 rounded-md text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">文件</button>
        </div>
        <div id="file-operation-bar" class="hidden flex flex-wrap items-center gap-2 rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2">
            <span id="file-selected-count-inline" class="hidden text-[11px] font-black text-zinc-700"></span>
            <button type="button" data-file-action="copy" data-destination="watch" class="rounded-lg border border-zinc-300 bg-white px-3 py-1.5 font-black text-zinc-800 hover:border-zinc-500 disabled:opacity-40">复制到监控目录</button>
            <button type="button" data-file-action="copy" data-destination="output" class="rounded-lg border border-zinc-300 bg-white px-3 py-1.5 font-bold text-zinc-700 hover:border-zinc-500 disabled:opacity-40">复制到输出目录</button>
            <input id="file-custom-destination" type="hidden" value="">
            <button type="button" id="file-pick-destination" class="rounded-lg border border-zinc-300 bg-white px-3 py-1.5 font-bold text-zinc-700 hover:border-zinc-500 disabled:opacity-40">选择其他目录</button>
            <span id="file-custom-destination-label" class="max-w-[18rem] truncate font-mono text-[11px] font-bold text-zinc-500">未选择其他目录</span>
            <button type="button" data-file-action="copy" data-destination="custom" class="rounded-lg border border-zinc-300 bg-white px-3 py-1.5 font-bold text-zinc-700 hover:border-zinc-500 disabled:opacity-40">复制到其他目录</button>
            <button type="button" data-file-action="move" data-destination="custom" class="rounded-lg border border-zinc-300 bg-white px-3 py-1.5 font-bold text-zinc-700 hover:border-zinc-500 disabled:opacity-40">移动</button>
            <button type="button" data-file-action="delete" class="rounded-lg border border-red-200 bg-white px-3 py-1.5 font-bold text-red-700 hover:border-red-400 disabled:opacity-40">删除</button>
        </div>
    </div>
    <div class="flex items-center gap-3 flex-1 max-w-md">
        <span id="file-operation-status" class="text-[11px] font-bold text-zinc-500"></span>
    </div>
</div>

<div class="flex items-center gap-2 font-mono text-xs text-zinc-500 px-1">
        <span class="text-zinc-400 font-bold uppercase tracking-wider text-[10px]">路径:</span>
    <div id="file-breadcrumb" class="flex items-center gap-1 text-zinc-700 font-bold">
    </div>
</div>

<div id="file-browser-shell" class="file-browser-shell">
<div class="file-table-card border border-zinc-200 bg-white rounded-xl overflow-hidden font-mono text-xs shadow-[0_8px_30px_rgba(0,0,0,0.015)]">
    <div class="file-table-head bg-gradient-to-b from-zinc-50 to-zinc-100/30 p-3 text-zinc-400 border-b border-zinc-200 text-[10px] font-bold tracking-wider select-none">
        <input id="file-select-all" type="checkbox" aria-label="选择当前列表全部项目" class="h-4 w-4 rounded border-zinc-300 accent-zinc-900">
        <button type="button" data-file-sort="name" class="file-sort-button">名称 / 路径 <span data-sort-indicator="name"></span></button>
        <button type="button" data-file-sort="size" class="file-sort-button text-right">大小 <span data-sort-indicator="size"></span></button>
        <button type="button" data-file-sort="mtime" class="file-sort-button">修改时间 <span data-sort-indicator="mtime"></span></button>
        <button type="button" data-file-sort="kind" class="file-sort-button">类型 <span data-sort-indicator="kind"></span></button>
        <span class="text-right">详情</span>
    </div>

    <div id="file-browser-list" class="divide-y divide-zinc-100 text-zinc-700">
    </div>
    <div id="file-pagination" class="file-pagination border-t border-zinc-100 bg-zinc-50/70 px-3 py-2 text-[11px]">
        <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-page-action="prev" class="file-page-button">上一页</button>
            <span id="file-page-summary" class="font-bold text-zinc-500">第 1 / 1 页</span>
            <button type="button" data-page-action="next" class="file-page-button">下一页</button>
            <label class="ml-auto flex items-center gap-2 font-bold text-zinc-500">
                每页
                <select id="file-page-size" class="rounded-md border border-zinc-200 bg-white px-2 py-1 font-mono text-zinc-700">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="all">全部</option>
                </select>
            </label>
            <label class="flex items-center gap-2 font-bold text-zinc-500">
                跳转
                <input id="file-page-jump" type="number" min="1" value="1" class="w-16 rounded-md border border-zinc-200 bg-white px-2 py-1 font-mono text-zinc-700">
            </label>
            <button type="button" id="file-page-go" class="file-page-button">前往</button>
        </div>
    </div>
</div>

<div id="file-properties-panel" class="hidden rounded-xl border border-zinc-200 bg-white p-4 text-xs shadow-sm">
    <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
        <div>
            <p class="font-mono text-[10px] font-black tracking-[0.12em] text-zinc-400">属性</p>
            <h3 class="mt-1 text-sm font-black text-zinc-900">文件详情</h3>
        </div>
        <button type="button" id="file-properties-close" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-600 hover:border-zinc-400">关闭</button>
    </div>
    <div id="file-properties-body" class="mt-3 grid gap-2 font-mono"></div>
</div>
</div>

<div id="file-context-menu" class="hidden fixed z-50 w-56 rounded-xl border border-zinc-200 bg-white p-1 text-xs shadow-2xl">
    <button type="button" data-context-action="select" class="file-context-item">选择</button>
    <button type="button" data-context-action="copy-watch" class="file-context-item">复制到监控目录</button>
    <button type="button" data-context-action="copy-output" class="file-context-item">复制到输出目录</button>
    <button type="button" data-context-action="copy-custom" class="file-context-item">复制到其他目录...</button>
    <button type="button" data-context-action="move-custom" class="file-context-item">移动到其他目录...</button>
    <button type="button" data-context-action="rename" class="file-context-item">重命名</button>
    <button type="button" data-context-action="properties" class="file-context-item">属性</button>
    <button type="button" data-context-action="delete" class="file-context-item danger">删除</button>
</div>

<div id="file-rename-dialog" class="hidden fixed inset-0 z-40 bg-zinc-950/25 p-4 backdrop-blur-sm">
    <div class="mx-auto mt-24 w-full max-w-md rounded-2xl border border-zinc-200 bg-white p-5 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
            <div>
                <h3 class="text-sm font-black text-zinc-900">重命名</h3>
                <p id="file-rename-current" class="mt-1 max-w-[34ch] truncate font-mono text-[11px] font-bold text-zinc-500">--</p>
            </div>
            <button type="button" id="file-rename-close" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-600 hover:border-zinc-400">关闭</button>
        </div>
        <label class="mt-4 block text-[11px] font-black tracking-[0.08em] text-zinc-400">新名称</label>
        <input id="file-rename-input" type="text" class="mt-2 w-full rounded-lg border border-zinc-200 bg-zinc-50 px-3 py-2 text-sm font-bold text-zinc-900 focus:border-zinc-400 focus:outline-none" autocomplete="off">
        <p id="file-rename-error" class="mt-2 min-h-[1rem] text-[11px] font-bold text-red-600"></p>
        <div class="mt-4 flex justify-end gap-2">
            <button type="button" id="file-rename-cancel" class="rounded-lg border border-zinc-200 bg-white px-4 py-2 text-xs font-bold text-zinc-700 hover:border-zinc-400">取消</button>
            <button type="button" id="file-rename-submit" class="rounded-lg bg-zinc-900 px-4 py-2 text-xs font-black text-white hover:bg-zinc-700">保存</button>
        </div>
    </div>
</div>

<div id="file-destination-picker" class="hidden fixed inset-0 z-40 bg-zinc-950/35 p-4 backdrop-blur-sm">
    <div class="mx-auto flex h-full max-h-[820px] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl">
        <div class="flex items-start justify-between border-b border-zinc-200 px-5 py-4">
            <div>
                <h3 id="file-destination-title" class="text-sm font-black text-zinc-900">选择目标目录</h3>
                <p id="file-destination-path" class="mt-1 max-w-[60ch] truncate font-mono text-[11px] font-bold text-zinc-500">可选目录</p>
            </div>
            <button type="button" id="file-destination-close" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-600 hover:border-zinc-400">关闭</button>
        </div>
        <div class="flex items-center gap-2 border-b border-zinc-100 px-5 py-3">
            <button type="button" id="file-destination-up" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-700 hover:border-zinc-400">上级</button>
            <button type="button" id="file-destination-roots" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-700 hover:border-zinc-400">根目录</button>
            <span id="file-destination-status" class="ml-auto text-[11px] font-bold text-zinc-500"></span>
        </div>
        <div id="file-destination-list" class="min-h-0 flex-1 overflow-auto p-4"></div>
        <div class="border-t border-zinc-200 px-5 py-4">
            <div class="mb-3 flex min-w-0 items-center gap-2 font-mono text-[11px] text-zinc-600">
                <span class="font-black text-zinc-400">已选</span>
                <span id="file-destination-selected" class="truncate font-bold text-zinc-900">未选择</span>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" id="file-destination-cancel" class="rounded-lg border border-zinc-200 bg-white px-4 py-2 text-xs font-bold text-zinc-700 hover:border-zinc-400">取消</button>
                <button type="button" id="file-destination-use" class="rounded-lg bg-emerald-700 px-4 py-2 text-xs font-black text-white hover:bg-emerald-800 disabled:opacity-40" disabled>复制到这里</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/files.js') }}"></script>
<style>
    /* 文件浏览页专用行样式，保持工程表格密度，同时支持多选操作。 */
    .file-browser-shell { display: grid; grid-template-columns: minmax(0,1fr); gap: 1rem; align-items: start; }
    .file-browser-shell[data-properties-open="true"] { grid-template-columns: minmax(0,1fr) minmax(20rem, 24rem); }
    .file-table-card { min-width: 0; }
    .file-table-head,
    .file-row { display: grid; grid-template-columns: 2rem minmax(0,1fr) 7rem 9.5rem 4.5rem 3.5rem; align-items: center; gap: 0.75rem; }
    .file-sort-button { display: inline-flex; min-width: 0; align-items: center; gap: 0.25rem; color: inherit; font: inherit; font-weight: 800; letter-spacing: inherit; text-align: left; text-transform: uppercase; }
    .file-sort-button.text-right { justify-self: end; text-align: right; }
    .file-sort-button:hover { color: #18181b; }
    .file-row { padding: 0.875rem; text-align: left; width: 100%; transition: background-color 0.15s, color 0.15s; }
    .file-row:hover { background-color: #fcfcfb; }
    .file-row[data-selected="true"] { background-color: #f4f4f5; }
    .file-row[data-openable="true"] .file-main { cursor: pointer; }
    .file-row[data-openable="true"]:hover .file-name { color: #047857; text-decoration: underline; text-underline-offset: 3px; }
    .file-select { height: 1rem; width: 1rem; border-radius: 0.25rem; accent-color: #18181b; }
    .file-main { min-width: 0; }
    .file-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #27272a; }
    .file-meta { display: flex; gap: 1rem; font-size: 10px; color: #a1a1aa; margin-top: 0.125rem; min-width: 0; }
    .file-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-time { color: #71717a; font-weight: 600; }
    .file-attrs { display: flex; align-items: center; gap: 0.375rem; }
    .file-kind { font-size: 10px; font-weight: bold; border: 1px solid #e4e4e7; padding: 0.125rem 0.5rem; border-radius: 0.375rem; background-color: #f4f4f5; color: #71717a; min-width: 42px; text-align: center; }
    .file-row[data-kind="disc"] .file-kind { background-color: #fef3c7; color: #d97706; border-color: #fde68a; }
    .file-size { text-align: right; color: #71717a; font-weight: 600; }
    .file-row-actions { display: flex; justify-content: flex-end; gap: 0.375rem; }
    .file-row-actions button { display: grid; place-items: center; width: 2rem; height: 2rem; border: 1px solid #e4e4e7; background: #fff; border-radius: 0.5rem; color: #52525b; font-weight: 800; padding: 0; }
    .file-row-actions button:hover { border-color: #a1a1aa; color: #18181b; }
    #file-properties-panel { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
    .file-prop-row { display: grid; grid-template-columns: 6rem minmax(0,1fr); gap: 1rem; border-bottom: 1px solid #f4f4f5; padding: 0.5rem 0; }
    .file-prop-row span { color: #a1a1aa; font-weight: 800; }
    .file-prop-row strong { min-width: 0; overflow-wrap: anywhere; color: #27272a; }
    .file-context-item { display: flex; width: 100%; align-items: center; gap: 0.5rem; border-radius: 0.6rem; padding: 0.65rem 0.75rem; text-align: left; font-weight: 800; color: #3f3f46; }
    .file-context-item:hover { background: #f4f4f5; color: #18181b; }
    .file-context-item.danger { color: #b91c1c; }
    .file-context-item.danger:hover { background: #fef2f2; color: #991b1b; }
    .file-destination-row { display: grid; grid-template-columns: 2.25rem minmax(0,1fr) auto; align-items: center; gap: 0.75rem; width: 100%; border: 1px solid #e4e4e7; border-radius: 0.8rem; background: #fff; padding: 0.75rem; text-align: left; }
    .file-destination-row:hover { border-color: #a1a1aa; background: #fafafa; }
    .file-destination-row[data-selected="true"] { border-color: #a1a1aa; background: #f4f4f5; }
    .file-destination-main { min-width: 0; }
    .file-destination-main strong,
    .file-destination-main small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-destination-main small { margin-top: 0.15rem; color: #71717a; }
    .file-page-button { border: 1px solid #e4e4e7; background: #fff; border-radius: 0.5rem; color: #52525b; font-weight: 800; padding: 0.35rem 0.65rem; }
    .file-page-button:hover:not(:disabled) { border-color: #a1a1aa; color: #18181b; }
    .file-page-button:disabled { opacity: 0.45; cursor: default; }
    .root-switcher [data-root][data-active="true"] { background: #18181b !important; color: #fff !important; border-color: #18181b !important; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .root-switcher [data-root][data-active="false"] { background: #fff !important; color: #52525b !important; border-color: #e4e4e7 !important; }
    #file-filters button:focus-visible,
    .root-switcher button:focus-visible,
    #file-up:focus-visible,
    #file-refresh:focus-visible,
    .file-row:focus-visible,
    #file-breadcrumb button:focus-visible { outline: 2px solid #10b981; outline-offset: 2px; }
    #file-breadcrumb button { font-weight: bold; color: #2563eb; transition: color 0.15s; cursor: pointer; background: none; border: none; padding: 0; }
    #file-breadcrumb button:hover { color: #1d4ed8; text-decoration: underline; }
    .breadcrumb-separator { color: #d4d4d8; padding: 0 0.25rem; font-weight: normal; }
    @media (max-width: 900px) {
        .file-browser-shell,
        .file-browser-shell[data-properties-open="true"] { grid-template-columns: minmax(0,1fr); }
        #file-properties-panel { position: static; max-height: none; }
        .file-table-head,
        .file-row { grid-template-columns: 2rem minmax(0,1fr) 3.5rem; }
        .file-table-head span:nth-of-type(2),
        .file-table-head button:nth-of-type(2),
        .file-table-head button:nth-of-type(3),
        .file-table-head button:nth-of-type(4),
        .file-time,
        .file-attrs,
        .file-size { display: none; }
    }
</style>
{% endblock %}
