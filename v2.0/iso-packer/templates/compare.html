{% extends "base.html" %}

{% block title %}媒体检测 · ISO Packer{% endblock %}

{% block content %}
<section class="space-y-5" aria-labelledby="compare-title">
    <div class="flex flex-col gap-4 border-b border-zinc-200 pb-5 lg:flex-row lg:items-end lg:justify-between">
        <div class="max-w-3xl space-y-2">
            <p class="text-[11px] font-black uppercase tracking-[0.24em] text-amber-600">成品比对</p>
            <h2 id="compare-title" class="text-2xl font-black tracking-tight text-zinc-950">媒体检测</h2>
            <p class="text-sm font-medium leading-6 text-zinc-500">扫描已经封装好的电影文件，按名称、年份、分辨率、来源和发布组聚合同片成品，用来发现不同组或不同版本。</p>
        </div>
        <button type="button" id="compare-scan" class="inline-flex min-h-9 items-center gap-2 rounded-lg bg-zinc-900 px-4 py-2 text-xs font-black text-white shadow-sm transition hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h7"/><path d="m17 14 3 3-3 3"/></svg>
            开始扫描
        </button>
    </div>

    <div class="grid grid-cols-2 gap-3 text-xs lg:grid-cols-5">
        <div class="rounded-xl border border-zinc-200 bg-white p-3 shadow-sm">
            <div class="font-mono text-[10px] font-black uppercase tracking-[0.16em] text-zinc-400">参与比对</div>
            <div id="compare-stat-candidates" class="mt-1 font-mono text-xl font-black text-zinc-950">--</div>
        </div>
        <div class="rounded-xl border border-zinc-200 bg-white p-3 shadow-sm">
            <div class="font-mono text-[10px] font-black uppercase tracking-[0.16em] text-zinc-400">分组</div>
            <div id="compare-stat-groups" class="mt-1 font-mono text-xl font-black text-zinc-950">--</div>
        </div>
        <div class="rounded-xl border border-amber-200 bg-amber-50/70 p-3 shadow-sm">
            <div class="font-mono text-[10px] font-black uppercase tracking-[0.16em] text-amber-500">多组影片</div>
            <div id="compare-stat-multi" class="mt-1 font-mono text-xl font-black text-amber-700">--</div>
        </div>
        <div class="rounded-xl border border-blue-200 bg-blue-50/70 p-3 shadow-sm">
            <div class="font-mono text-[10px] font-black uppercase tracking-[0.16em] text-blue-500">同片多版</div>
            <div id="compare-stat-duplicates" class="mt-1 font-mono text-xl font-black text-blue-700">--</div>
        </div>
        <div class="rounded-xl border border-zinc-200 bg-white p-3 shadow-sm">
            <div class="font-mono text-[10px] font-black uppercase tracking-[0.16em] text-zinc-400">扫描目录</div>
            <div id="compare-stat-scanned" class="mt-1 font-mono text-xl font-black text-zinc-950">--</div>
        </div>
    </div>

    <section class="rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm" aria-labelledby="compare-control-title">
        <div class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
            <div class="min-w-0 flex-1 space-y-3">
                <div class="flex flex-wrap items-center gap-2 text-[11px]">
                    <span id="compare-control-title" class="font-black uppercase tracking-[0.14em] text-zinc-400">成品位置</span>
                    <div id="compare-root-switcher" class="flex gap-1 rounded-xl border border-zinc-200 bg-zinc-50 p-1 font-bold">
                        <button type="button" data-compare-root="output" data-root-path="{{ browser_roots.output|e }}" data-root-base="{{ browser_roots.output|e }}" data-active="false" class="rounded-lg px-3 py-1.5 text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">本机输出</button>
                        <button type="button" data-compare-root="cd2" data-root-path="{{ browser_roots.cd2_finished|e }}" data-root-base="{{ browser_roots.cd2|e }}" data-active="true" class="rounded-lg px-3 py-1.5 text-zinc-600 data-[active=true]:bg-white data-[active=true]:text-zinc-900 data-[active=true]:shadow-sm">CD2 成品</button>
                    </div>
                </div>
                <label class="sr-only" for="compare-path">扫描路径</label>
                <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto]">
                    <input id="compare-path" type="text" value="{{ browser_roots.cd2_finished|e }}" class="w-full rounded-lg border border-zinc-200 bg-[#fbfbfa] px-3 py-2 font-mono text-xs font-bold text-zinc-800 shadow-inner focus:border-zinc-400 focus:outline-none">
                    <button type="button" id="compare-pick-directory" class="inline-flex min-h-10 items-center justify-center rounded-lg border border-zinc-200 bg-white px-4 py-2 text-xs font-black text-zinc-700 shadow-sm transition hover:border-zinc-400 hover:text-zinc-950 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">选择目录</button>
                </div>
            </div>
            <div class="grid gap-2 sm:grid-cols-[160px_1fr] xl:w-[420px]">
                <label class="block">
                    <span class="block text-[10px] font-black uppercase tracking-[0.14em] text-zinc-400">扫描范围</span>
                    <select id="compare-depth" class="mt-2 min-h-10 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs font-bold text-zinc-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">
                        <option value="1" selected>只看当前目录</option>
                        <option value="2">包含一级子目录</option>
                    </select>
                </label>
                <label class="block">
                    <span class="block text-[10px] font-black uppercase tracking-[0.14em] text-zinc-400">搜索</span>
                    <input id="compare-search" type="search" placeholder="片名 / 年份 / 组名" class="mt-2 min-h-10 w-full rounded-lg border border-zinc-200 bg-[#fbfbfa] px-3 py-2 font-mono text-xs font-bold text-zinc-800 shadow-inner focus:border-zinc-400 focus:outline-none">
                </label>
            </div>
        </div>
    </section>

    <section class="overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-sm" aria-labelledby="compare-results-title">
        <div class="flex flex-col gap-2 border-b border-zinc-200 p-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h3 id="compare-results-title" class="text-sm font-black tracking-tight text-zinc-950">成品分组</h3>
                <p id="compare-summary" class="mt-1 text-xs font-medium text-zinc-500">等待扫描。</p>
            </div>
            <span id="compare-current-path" class="max-w-full truncate rounded-full border border-zinc-200 bg-zinc-50 px-3 py-1 font-mono text-[11px] font-bold text-zinc-500 sm:max-w-[520px]">--</span>
        </div>
        <div id="compare-groups" class="divide-y divide-zinc-100 text-xs" aria-live="polite"></div>
    </section>

    <div id="compare-directory-picker" class="hidden fixed inset-0 z-40 bg-zinc-950/35 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="compare-directory-title">
        <div class="mx-auto flex h-full max-h-[820px] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl">
            <div class="flex items-start justify-between gap-4 border-b border-zinc-200 px-5 py-4">
                <div class="min-w-0">
                    <h3 id="compare-directory-title" class="text-sm font-black text-zinc-900">选择成品目录</h3>
                    <p id="compare-directory-path" class="mt-1 max-w-[60ch] truncate font-mono text-[11px] font-bold text-zinc-500">可选目录</p>
                </div>
                <button type="button" id="compare-directory-close" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-600 hover:border-zinc-400">关闭</button>
            </div>
            <div class="flex items-center gap-2 border-b border-zinc-100 px-5 py-3">
                <button type="button" id="compare-directory-up" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-700 hover:border-zinc-400">上级</button>
                <button type="button" id="compare-directory-roots" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-700 hover:border-zinc-400">根目录</button>
                <span id="compare-directory-status" class="ml-auto text-[11px] font-bold text-zinc-500"></span>
            </div>
            <div id="compare-directory-list" class="min-h-0 flex-1 overflow-auto p-4"></div>
            <div class="border-t border-zinc-200 px-5 py-4">
                <div class="mb-3 flex min-w-0 items-center gap-2 font-mono text-[11px] text-zinc-600">
                    <span class="font-black text-zinc-400">已选</span>
                    <span id="compare-directory-selected" class="truncate font-bold text-zinc-900">未选择</span>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" id="compare-directory-cancel" class="rounded-lg border border-zinc-200 bg-white px-4 py-2 text-xs font-bold text-zinc-700 hover:border-zinc-400">取消</button>
                    <button type="button" id="compare-directory-use" class="rounded-lg bg-zinc-900 px-4 py-2 text-xs font-black text-white hover:bg-zinc-700 disabled:opacity-40" disabled>使用此目录</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block script %}
<style>
    .compare-directory-row { display: grid; grid-template-columns: 2.25rem minmax(0,1fr) auto; align-items: center; gap: 0.75rem; width: 100%; border: 1px solid #e4e4e7; border-radius: 0.8rem; background: #fff; padding: 0.75rem; text-align: left; }
    .compare-directory-row:hover { border-color: #a1a1aa; background: #fafafa; }
    .compare-directory-row[data-selected="true"] { border-color: #a1a1aa; background: #f4f4f5; }
    .compare-directory-row:disabled { opacity: 0.45; cursor: default; }
    .compare-directory-main { min-width: 0; }
    .compare-directory-main strong,
    .compare-directory-main small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compare-directory-main small { margin-top: 0.15rem; color: #71717a; }
</style>
<script src="{{ url_for('static', filename='js/compare.js') }}"></script>
{% endblock %}
