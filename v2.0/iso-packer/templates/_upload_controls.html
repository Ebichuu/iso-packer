<section data-upload-control class="rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm" aria-label="CD2 全部上传控制">
    <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
            <h3 class="text-sm font-black text-zinc-950">CD2 全部上传控制</h3>
            <p class="mt-1 text-[11px] leading-5 text-zinc-500">作用于当前 CD2 实例的全部上传任务，包含其他程序创建的任务。恢复仅处理由本服务暂停的任务；新增外部任务会持续检查，暂停确认前仍可能上传。</p>
        </div>
        <button type="button" data-upload-refresh class="min-h-9 rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-[11px] font-bold text-zinc-600 hover:bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">刷新状态</button>
    </div>
    <div class="mt-3 rounded-xl border border-zinc-200 bg-zinc-50 p-3" role="status" aria-live="polite">
        <p data-upload-status class="text-xs font-bold text-zinc-800">正在读取上传控制状态…</p>
        <p data-upload-detail class="mt-1 text-[11px] leading-5 text-zinc-500"></p>
        <p data-upload-error class="mt-1 hidden text-[11px] font-semibold leading-5 text-red-700"></p>
    </div>
    <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" data-upload-action="pause" disabled class="min-h-10 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-bold text-amber-800 hover:bg-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 disabled:opacity-40">暂停 CD2 全部上传</button>
        <button type="button" data-upload-action="resume" disabled class="min-h-10 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs font-bold text-zinc-700 hover:bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2 disabled:opacity-40">解除手动暂停</button>
    </div>
    <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:items-end">
        <label class="min-w-0 flex-1 text-[11px] font-semibold text-zinc-700">
            暂停到自定义时间（北京时间）
            <input type="datetime-local" data-upload-until form="cd2-upload-manual-form" aria-label="暂停至北京时间" class="mt-1 block min-h-10 w-full rounded-lg border border-zinc-200 bg-[#fbfbfa] px-3 py-2 font-mono text-xs text-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">
        </label>
        <button type="button" data-upload-action="pause-until" disabled class="min-h-10 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs font-bold text-zinc-700 hover:bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2 disabled:opacity-40">暂停到此时间</button>
    </div>
    <p class="mt-2 text-[10px] leading-5 text-zinc-500">未设置结束时间的手动暂停会一直保留；解除手动暂停后，仍遵守已保存的每日暂停窗口。手动操作使用已保存的 CD2 连接配置。</p>
</section>
