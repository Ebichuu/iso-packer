services:
  iso-packer:
    # 方式 1: 使用 Docker Hub 预构建镜像（推荐，开箱即用）
    image: ebichu/iso-packer:latest

    # 方式 2: 从本地源码构建（如需自定义，取消下面注释，注释上面 image）
    # build: .

    container_name: iso-packer
    restart: unless-stopped

    ports:
      - "15865:15865"

    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1

    volumes:
      # 数据持久化目录（配置、状态、日志）
      - ./data:/app

      # 监控目录 - CD2 挂载的 115 网盘下载目录
      - /mnt/115Download:/watch

      # 临时输出目录 - ISO 封装临时存放
      - /mnt/iso-output:/output

      # CD2 挂载根目录 - 用于转移文件
      # 重要：必须使用 :rslave 参数支持挂载传播
      - /CloudNAS/CloudDrive:/cd2:rslave

    # 网络模式
    network_mode: bridge

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
