name: Build and Push Docker Hub Test Image

on:
  push:
    branches:
      - main
    paths:
      - 'v2.0/**'
      - '.github/workflows/dockerhub-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-packer-test-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate application version
        run: python v2.0/iso-packer/scripts/check_release.py

      - name: Install test dependencies
        run: python -m pip install -r v2.0/requirements.txt

      - name: Run backend tests and smoke test
        working-directory: v2.0/iso-packer
        run: |
          python -m unittest discover -p 'test_*.py' -v
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -B scripts/smoke_v2.py
          python -B -m py_compile app.py core.py worker_runtime.py upload_control.py release_calendar_fetcher.py scripts/smoke_v2.py scripts/update_release_calendar.py scripts/check_release.py scripts/acceptance_runtime.py

      - name: Check frontend JavaScript syntax
        working-directory: v2.0/iso-packer
        run: |
          for file in static/js/*.js; do node --check "$file"; done
          node --test scripts/test_frontend_races.cjs scripts/test_upload_controls.cjs

      - name: Validate deployment configuration
        run: |
          docker compose -f v2.0/docker-compose.yml config --quiet
          bash -n v2.0/deploy.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read validated build metadata
        id: version
        run: python v2.0/iso-packer/scripts/check_release.py --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2.0/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.IMAGE_VERSION }}
            VCS_REF=${{ steps.version.outputs.REVISION }}
          tags: |
            ebichu/iso-packer:test
            ebichu/iso-packer:sha-${{ steps.version.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
