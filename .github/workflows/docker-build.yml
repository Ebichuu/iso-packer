name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r v2.0/requirements.txt

      - name: Run backend tests and smoke test
        working-directory: v2.0/iso-packer
        run: |
          python -m unittest -v test_app
          python -B scripts/smoke_v2.py
          python -B -m py_compile app.py core.py release_calendar_fetcher.py scripts/smoke_v2.py scripts/update_release_calendar.py

      - name: Check frontend JavaScript syntax
        working-directory: v2.0/iso-packer
        run: for file in static/js/*.js; do node --check "$file"; done

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          IMAGE_VERSION="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          test -n "$IMAGE_VERSION"
          BUILD_VERSION="$(date +'%Y%m%d-%H%M%S')"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker image tags: latest, v$IMAGE_VERSION, $IMAGE_VERSION, $BUILD_VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2.0/Dockerfile
          push: true
          tags: |
            ebichu/iso-packer:latest
            ebichu/iso-packer:v${{ steps.version.outputs.IMAGE_VERSION }}
            ebichu/iso-packer:${{ steps.version.outputs.IMAGE_VERSION }}
            ebichu/iso-packer:${{ steps.version.outputs.BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
