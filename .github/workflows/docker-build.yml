name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'iso-packer/**'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          IMAGE_VERSION="$(awk -F'"' '/^LABEL version=/{print $2; exit}' Dockerfile)"
          test -n "$IMAGE_VERSION"
          BUILD_VERSION="$(date +'%Y%m%d-%H%M%S')"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker image tags: latest, $IMAGE_VERSION, $BUILD_VERSION"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ebichu/iso-packer:latest
            ebichu/iso-packer:${{ steps.version.outputs.IMAGE_VERSION }}
            ebichu/iso-packer:${{ steps.version.outputs.BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
