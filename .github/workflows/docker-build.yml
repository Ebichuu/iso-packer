name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'v2.0/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          IMAGE_VERSION="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          test -n "$IMAGE_VERSION"
          BUILD_VERSION="$(date +'%Y%m%d-%H%M%S')"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker image tags: latest, v$IMAGE_VERSION, $IMAGE_VERSION, $BUILD_VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2.0/Dockerfile
          push: true
          tags: |
            ebichu/iso-packer:latest
            ebichu/iso-packer:v${{ steps.version.outputs.IMAGE_VERSION }}
            ebichu/iso-packer:${{ steps.version.outputs.IMAGE_VERSION }}
            ebichu/iso-packer:${{ steps.version.outputs.BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
