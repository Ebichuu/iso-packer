services:
  iso-packer:
    image: ebichu/iso-packer:latest
    container_name: iso-packer
    restart: unless-stopped

    ports:
      - "15865:15865"

    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1

    volumes:
      # 数据持久化目录（配置、状态、日志）
      - ./data:/data

      # 监控目录 - CD2 挂载的 115 网盘下载目录
      - /mnt/115Download:/watch

      # 临时输出目录 - ISO 封装临时存放
      - /mnt/iso-output:/output

      # CD2 挂载根目录 - 修复方案 3：模仿 Symedia，挂载父目录
      # 使用 rslave 接收来自 CD2 容器的挂载传播
      - /CloudNAS:/CloudNAS:rslave

    network_mode: bridge

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
